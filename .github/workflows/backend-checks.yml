name: Backend Checks

# The backend quality gate. Until now PHPUnit only ran locally, so a Composer
# update (e.g. carbon, phpmailer, webauthn-lib) could reach production without
# a single backend test having run against it.
#
# Runs on PHP 8.5, matching `require.php` and `config.platform.php` in
# backend/composer.json. Most tests use an in-memory SQLite connection; the
# integration tests (e.g. SecurityLockoutIntegrationTest) need the real schema,
# so a MariaDB service is migrated first — MariaDB because production runs on
# it (see migrations-smoke-test.yml).
#
# DB settings come from the job environment. `variables_order=EGPCS` makes PHP
# copy them into $_ENV, which is where Config reads them; the default php.ini
# ("GPCS") would leave $_ENV empty.
#
# Deliberately no `paths:` filter, for the same reason as frontend-checks.yml:
# a required check that is path-filtered never reports on PRs outside those
# paths and then blocks them.

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (PHP 8.5)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3.2
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: hypnose_stammtisch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: hypnose_stammtisch
      DB_USER: root
      DB_PASS: root
      APP_DEBUG: "true"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: pdo, pdo_sqlite, pdo_mysql, mbstring, json, openssl
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --no-check-publish

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # The app sets `time_zone = 'Europe/Berlin'` on every connection; a fresh
      # MariaDB container has no named time zones loaded.
      - name: Load time zone tables into MariaDB
        working-directory: .
        run: >-
          docker exec ${{ job.services.mariadb.id }} sh -c
          'mariadb-tzinfo-to-sql /usr/share/zoneinfo | mariadb -uroot -proot mysql'

      - name: Run migrations
        run: php -d variables_order=EGPCS migrations/migrate.php migrate

      - name: Run PHPUnit
        run: php -d variables_order=EGPCS vendor/bin/phpunit

      - name: Composer audit
        run: composer audit --locked
